<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Salah Times</title>
<meta name="description" content="Prayer and jama'ah times for Shahjalal Masjid, Manor Park">
<meta name="theme-color" content="#08151C">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Salah Times">
<meta name="application-name" content="Salah Times">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg: #08151C;
  --bg-deep: #050C11;
  --text: #F7F4EC;
  --sec: #B7C6CD;
  --ter: #7F939C;
  --glass: rgba(214, 236, 246, 0.06);
  --border: rgba(214, 236, 246, 0.12);
  --fill: rgba(214, 236, 246, 0.08);
  --sep: rgba(214, 236, 246, 0.08);
  --track: rgba(214, 236, 246, 0.10);
  --clay: #D97757;
  --clay-bg: rgba(217, 119, 87, 0.16);
  --on-clay: #08151C;
  --green: #1FC39A;
  --green-bg: rgba(31, 195, 154, 0.15);
  --dawn: #9FB0F0;
  --dawn-bg: rgba(110, 130, 220, 0.14);
  --sheet: rgba(14, 36, 46, 0.88);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", sans-serif;
  --rounded: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --bottom-inset: var(--safe-bottom); /* set to 0 when iOS cuts the web view short (see fitBottom) */
  color-scheme: dark;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
/* The page itself never scrolls — only .scroller does, so the tab bar stays pinned.
   (The status bar is opaque: on iOS 26 a see-through status bar makes the web view stop
   short of the bottom of the screen.) Zoom is off: no double-tap or pinch zoom. */
html, body { height: 100%; overflow: hidden; background: var(--bg-deep); touch-action: manipulation; }
html.short-vp { --bottom-inset: 0px; }
#shell {
  position: fixed; left: 0; right: 0; top: 0; height: 100%; height: 100dvh; overflow: hidden;
  background:
    radial-gradient(130% 75% at 25% -5%, #1A4655 0%, rgba(26, 70, 85, 0) 60%),
    radial-gradient(120% 60% at 100% 110%, #0E2A36 0%, rgba(14, 42, 54, 0) 60%),
    linear-gradient(180deg, #0B1E27 0%, var(--bg) 45%, var(--bg-deep) 100%);
}
/* The status bar above the app is solid black: start the app black too and fade into the
   teal, so there's no hard edge where the status bar ends. Sits above the glow layers. */
#shell::after {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 190px; z-index: 0; pointer-events: none;
  background: linear-gradient(180deg, #000 0%, rgba(0, 0, 0, 0.82) 22%, rgba(0, 0, 0, 0.45) 55%, rgba(0, 0, 0, 0) 100%);
}
html.short-vp #shell::after { display: none; }
body {
  color: var(--text);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  user-select: none;
  -webkit-user-select: none;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--clay); outline-offset: 2px; }

/* Press feedback */
.press { transition: transform .15s ease, opacity .15s ease; }
.press:active { transform: scale(0.965); opacity: 0.85; }

/* Glow behind the glass — changes with the next prayer */
.glow { position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: 0; transition: opacity 1.4s ease; }
.glow.on { opacity: 1; }
#g-fajr { background: radial-gradient(120% 60% at 85% -10%, rgba(110, 130, 220, 0.34) 0%, rgba(110, 130, 220, 0) 60%), radial-gradient(90% 40% at 0% 100%, rgba(217, 119, 87, 0.10) 0%, rgba(217, 119, 87, 0) 60%); }
#g-zuhr { background: radial-gradient(120% 60% at 60% -10%, rgba(245, 220, 160, 0.26) 0%, rgba(245, 220, 160, 0) 60%), radial-gradient(80% 40% at 0% 0%, rgba(0, 168, 132, 0.10) 0%, rgba(0, 168, 132, 0) 60%); }
#g-asr { background: radial-gradient(110% 55% at 88% -8%, rgba(217, 119, 87, 0.28) 0%, rgba(217, 119, 87, 0) 55%), radial-gradient(80% 45% at -5% 2%, rgba(0, 168, 132, 0.12) 0%, rgba(0, 168, 132, 0) 60%); }
#g-maghrib { background: radial-gradient(120% 60% at 50% -10%, rgba(230, 95, 60, 0.40) 0%, rgba(230, 95, 60, 0) 58%), radial-gradient(90% 50% at 100% 30%, rgba(160, 60, 120, 0.20) 0%, rgba(160, 60, 120, 0) 60%); }
#g-isha { background: radial-gradient(120% 60% at 20% -10%, rgba(80, 90, 190, 0.32) 0%, rgba(80, 90, 190, 0) 60%), radial-gradient(70% 40% at 100% 0%, rgba(0, 168, 132, 0.08) 0%, rgba(0, 168, 132, 0) 60%); }

.glass {
  background: var(--glass);
  border: 1px solid var(--border);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), inset 0 -1px 0 rgba(0, 0, 0, 0.25), 0 18px 40px rgba(0, 0, 0, 0.45);
  -webkit-backdrop-filter: blur(30px) saturate(170%);
  backdrop-filter: blur(30px) saturate(170%);
}

.scroller {
  position: absolute; inset: 0; z-index: 1;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
}
.app {
  max-width: 480px; margin: 0 auto;
  padding: calc(var(--safe-top) + 22px) 16px calc(var(--bottom-inset) + 100px);
}
.view { display: none; flex-direction: column; gap: 16px; }
.view.active { display: flex; animation: fadeIn .25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Large title + compact bar */
.header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 0 4px; }
.header h1 { font-size: 34px; font-weight: 700; letter-spacing: 0.2px; line-height: 1.15; }
.header .sub { font-size: 15px; color: var(--sec); margin-top: 3px; }
.icon-btn { width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-bottom: 4px; }
.offline-pill { display: none; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--fill); color: var(--sec); margin-bottom: 6px; }
body.offline .offline-pill { display: inline-block; }
.topbar {
  position: absolute; z-index: 8; left: 0; right: 0; top: 0;
  padding: calc(var(--safe-top) + 10px) 16px 10px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: rgba(8, 21, 28, 0.62); border-bottom: 1px solid var(--sep);
  -webkit-backdrop-filter: blur(30px) saturate(170%); backdrop-filter: blur(30px) saturate(170%);
  opacity: 0; transform: translateY(-8px); pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
}
.topbar.show { opacity: 1; transform: none; }
.topbar b { font-size: 17px; font-weight: 600; }
.topbar span { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--sec); display: flex; gap: 6px; align-items: center; }
.topbar span:empty { display: none; }
.topbar .c { color: var(--clay); }
.topbar .g { color: var(--green); }

/* Rolling digits */
.roll { display: inline-flex; height: 1.15em; line-height: 1.15em; overflow: hidden; white-space: nowrap; }
.rd { display: inline-block; height: 1.15em; overflow: hidden; }
.rs { display: flex; flex-direction: column; transition: transform .5s cubic-bezier(.2, .9, .25, 1.1); }
.rs span { display: block; height: 1.15em; }
.roll.noanim .rs { transition: none; }

/* Hero */
.hero { border-radius: 32px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.hero-top { display: flex; align-items: center; gap: 12px; padding: 0 2px; }
.hero-icon { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: var(--clay-bg); color: var(--clay); flex-shrink: 0; transition: background .3s, color .3s; }
.hero-label { font-size: 12px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--sec); }
.hero-name { font-size: 24px; font-weight: 700; letter-spacing: -0.2px; }
.chip { font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 999px; background: var(--fill); color: var(--sec); white-space: nowrap; }
.chip:empty { display: none; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { border-radius: 22px; padding: 12px 14px 14px; display: flex; flex-direction: column; align-items: stretch; gap: 4px; border: 1px solid var(--border); min-width: 0; text-align: left; }
.tile.begin { background: var(--clay-bg); }
.tile.jamah { background: var(--green-bg); }
.tile-label { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
.tile-label svg { opacity: 0.7; }
.tile.begin .tile-label { color: var(--clay); }
.tile.jamah .tile-label { color: var(--green); }
.tile-value { font-family: var(--rounded); font-size: 31px; font-weight: 600; letter-spacing: -0.8px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tile-sub { font-size: 13px; color: var(--sec); }
.tile-sub b { font-weight: 600; color: var(--text); }
.bar { height: 5px; border-radius: 999px; background: var(--track); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; width: 0; border-radius: 999px; transition: width 1s linear; }
.tile.begin .bar i { background: var(--clay); }
.tile.jamah .bar i, .soon .bar i { background: var(--green); }

/* Jama'ah soon (last 15 minutes) */
.soon { display: none; flex-direction: column; gap: 10px; }
.hero.is-soon .tiles { display: none; }
.hero.is-soon .soon { display: flex; }
.hero.is-soon .hero-icon { background: var(--green-bg); color: var(--green); }
.soon-box { border-radius: 26px; padding: 18px 18px 16px; display: flex; flex-direction: column; align-items: center; gap: 4px; background: var(--green-bg); border: 1px solid rgba(0, 168, 132, 0.45); animation: soonPulse 2.4s ease-in-out infinite; }
.soon-box .tile-label { color: var(--green); }
.soon-value { font-family: var(--rounded); font-size: 72px; font-weight: 600; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
.soon-box .bar { width: 100%; height: 6px; margin-top: 10px; }
.soon-strip { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 18px; background: var(--clay-bg); font-size: 14px; color: var(--sec); }
.soon-strip b { font-weight: 600; color: var(--text); }
.soon-strip .r { margin-left: auto; font-weight: 600; color: var(--clay); white-space: nowrap; }
@keyframes soonPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0, 168, 132, 0.40), inset 0 1px 0 rgba(255, 255, 255, 0.12); }
  50% { box-shadow: 0 0 0 10px rgba(0, 168, 132, 0), inset 0 1px 0 rgba(255, 255, 255, 0.12); }
}

/* Ramadan */
.ramadan { display: none; border-radius: 32px; padding: 16px; flex-direction: column; gap: 14px; }
.ramadan.show { display: flex; }
.ram-strip { display: flex; gap: 3px; }
.ram-strip i { flex: 1; height: 6px; border-radius: 999px; background: var(--track); }
.ram-strip i.on { background: var(--clay); }
.tile.iftar { background: var(--clay-bg); }
.tile.iftar .tile-label { color: var(--clay); }
.tile.suhoor { background: var(--dawn-bg); }
.tile.suhoor .tile-label { color: var(--dawn); }

/* Section heading */
.section-head { display: flex; align-items: baseline; justify-content: space-between; padding: 4px 4px 0; }
.section-head h2 { font-size: 20px; font-weight: 700; }
.section-head span { font-size: 13px; color: var(--ter); }

/* Grouped list */
.list { border-radius: 26px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 58px; border-bottom: 1px solid var(--sep); }
.row:last-child { border-bottom: none; }
.row-icon { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: var(--fill); color: var(--sec); flex-shrink: 0; }
.row-main { flex-grow: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0; padding: 8px 0; }
.row-title { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 600; }
.row-sub { font-size: 13px; color: var(--sec); }
.row-time { font-size: 19px; font-weight: 600; letter-spacing: -0.2px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
.pill.next { background: var(--clay); color: var(--on-clay); }
.pill.now { background: var(--fill); color: var(--sec); font-weight: 600; }
.row.is-next { background: var(--clay-bg); }
.row.is-next .row-icon, .row.is-next .row-title { color: var(--clay); }
.row.is-next .row-time { color: var(--green); }
.row.is-now .row-icon { color: var(--text); }
.row.is-past .row-icon { color: var(--ter); }
.row.is-past .row-title, .row.is-past .row-time { color: var(--sec); }
.row.is-past .row-sub { color: var(--ter); }

/* Week table */
.week-head, .week-row { display: flex; align-items: center; padding: 0 8px 0 14px; }
.week-head { padding-top: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--sep); font-size: 11px; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase; color: var(--ter); }
.week-row { width: 100%; text-align: left; border-bottom: 1px solid var(--sep); }
.week-row:last-child { border-bottom: none; }
.week-row.today { background: var(--clay-bg); }
.week-day { flex-grow: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0; padding: 8px 0; }
.week-day b { font-size: 16px; font-weight: 700; }
.week-row.today .week-day b, .week-row.today .week-day span { color: var(--clay); }
.week-day span { font-size: 11px; color: var(--ter); }
.wcol { width: 46px; flex-shrink: 0; text-align: center; }
.wcell { position: relative; height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; }
.wcell.changed { color: var(--green); font-weight: 700; }
.wcell.changed::after { content: ""; position: absolute; top: 7px; right: 5px; width: 5px; height: 5px; border-radius: 999px; background: var(--green); }
.wcell small { font-size: 8.5px; font-weight: 700; letter-spacing: 0.3px; color: var(--clay); }

.changes { border-radius: 26px; padding: 14px 16px 4px; }
.changes-title { display: flex; align-items: center; gap: 8px; padding-bottom: 4px; font-size: 16px; font-weight: 700; }
.changes-title::before { content: ""; width: 8px; height: 8px; border-radius: 999px; background: var(--green); }
.change-row { display: flex; align-items: center; gap: 12px; height: 48px; border-bottom: 1px solid var(--sep); }
.change-row:last-child { border-bottom: none; }
.change-row .name { flex-grow: 1; font-size: 16px; font-weight: 600; }
.change-row s { font-size: 15px; color: var(--ter); font-variant-numeric: tabular-nums; }
.change-row .new { min-width: 40px; text-align: right; font-size: 16px; font-weight: 700; color: var(--green); font-variant-numeric: tabular-nums; }

/* Month */
.month-nav { display: flex; border-radius: 999px; margin-bottom: 4px; flex-shrink: 0; }
.month-nav button { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 999px; }
.month-nav button:disabled { opacity: 0.3; cursor: default; }
.calendar { border-radius: 28px; padding: 14px 10px 8px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 2px; }
.cal-dow { text-align: center; font-size: 12px; font-weight: 600; color: var(--ter); padding-bottom: 4px; }
.cal-day { height: 50px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: var(--text); }
.cal-day.past { color: var(--ter); }
.cal-day .n { font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
.cal-day.fri .n { font-weight: 700; }
.cal-day .h { font-size: 9px; color: var(--ter); }
.cal-day .d { width: 4px; height: 4px; border-radius: 999px; }
.cal-day.changed .d { background: var(--green); }
.cal-day.today { box-shadow: inset 0 0 0 1.5px var(--clay); color: var(--clay); }
.cal-day.today .h { color: var(--clay); }
.cal-day:disabled { opacity: 0.35; cursor: default; }
.legend { display: flex; gap: 16px; justify-content: center; padding: 8px 0 2px; font-size: 12px; color: var(--sec); flex-wrap: wrap; }
.legend span { display: flex; align-items: center; gap: 6px; }
.legend .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--green); }

.empty { border-radius: 26px; padding: 22px 18px; text-align: center; color: var(--sec); font-size: 15px; line-height: 1.5; }

/* Tab bar (fixed, outside the scroller) */
.fade { position: absolute; left: 0; right: 0; bottom: 0; height: calc(100px + var(--bottom-inset)); z-index: 5; pointer-events: none; background: linear-gradient(to bottom, rgba(5, 12, 17, 0), var(--bg-deep) 72%); }
.tabbar {
  position: absolute; z-index: 10; left: 0; right: 0; margin: 0 auto;
  /* iOS 26 style: the floating bar sits inside the home-indicator area, ~20pt off the edge */
  bottom: max(10px, calc(var(--bottom-inset) - 12px));
  width: min(calc(100% - 40px), 420px); height: 64px; border-radius: 999px;
  display: flex; align-items: center; padding: 0 5px;
}
.tab-pill {
  position: absolute; left: 5px; top: 5px; bottom: 5px; width: calc((100% - 10px) / 3);
  border-radius: 999px; background: rgba(214, 236, 246, 0.10); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16);
  transform: translateX(calc(var(--i, 0) * 100%));
  transition: transform .45s cubic-bezier(.3, 1.35, .45, 1);
}
.tab { position: relative; z-index: 1; flex: 1; height: 54px; border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; font-weight: 600; color: var(--text); transition: color .25s, transform .15s; }
.tab[aria-selected="true"] { color: var(--clay); }

/* Bottom sheet */
.backdrop { position: absolute; inset: 0; z-index: 20; background: rgba(0, 0, 0, 0.45); opacity: 0; pointer-events: none; transition: opacity .25s; }
.backdrop.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: absolute; z-index: 21; left: 0; right: 0; margin: 0 auto; bottom: max(8px, calc(var(--bottom-inset) - 20px));
  width: min(calc(100% - 16px), 464px); transform: translateY(110%); visibility: hidden;
  border-radius: 40px; padding: 8px 20px 20px;
  background: var(--sheet); border: 1px solid var(--border);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 -12px 40px rgba(0, 0, 0, 0.5);
  -webkit-backdrop-filter: blur(40px) saturate(170%); backdrop-filter: blur(40px) saturate(170%);
  transition: transform .32s cubic-bezier(.2, .9, .3, 1), visibility 0s linear .32s;
}
.sheet.open { transform: none; visibility: visible; transition: transform .32s cubic-bezier(.2, .9, .3, 1); }
.grabber { width: 38px; height: 5px; border-radius: 999px; background: rgba(214, 236, 246, 0.28); margin: 0 auto 12px; }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.sheet-head h2 { font-size: 22px; font-weight: 700; }
.sheet-head p { font-size: 14px; color: var(--sec); margin-top: 2px; }
.close { width: 36px; height: 36px; border-radius: 999px; background: var(--fill); display: flex; align-items: center; justify-content: center; color: var(--sec); flex-shrink: 0; }
.sheet-cols { display: flex; justify-content: flex-end; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--ter); }
.sheet-cols span, .srow .b, .srow .j { text-align: right; width: 80px; }
.srow { display: flex; align-items: center; gap: 12px; height: 46px; border-bottom: 1px solid var(--sep); }
.srow:last-child { border-bottom: none; }
.srow .ic { color: var(--sec); display: flex; }
.srow .nm { flex-grow: 1; font-size: 16px; font-weight: 600; }
.srow .b { font-size: 14px; color: var(--sec); font-variant-numeric: tabular-nums; }
.srow .j { font-size: 16px; font-weight: 600; color: var(--green); font-variant-numeric: tabular-nums; }
.srow.jum .ic, .srow.jum .nm { color: var(--clay); }
.srow.muted .j { color: var(--ter); }

/* Install hint */
.install { position: absolute; z-index: 15; left: 0; right: 0; margin: 0 auto; bottom: calc(var(--bottom-inset) + 70px); width: min(calc(100% - 32px), 440px); border-radius: 22px; padding: 12px 12px 12px 16px; display: none; align-items: center; gap: 12px; }
.install.show { display: flex; }
.install p { flex-grow: 1; font-size: 13px; color: var(--sec); line-height: 1.4; }
.install p b { color: var(--text); }
.install .go { font-size: 14px; font-weight: 700; padding: 8px 14px; border-radius: 999px; background: var(--clay); color: var(--on-clay); }
.install .x { width: 32px; height: 32px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--ter); }

/* Toast */

<body>
<div id="shell">
<div class="glow" id="g-fajr" aria-hidden="true"></div>
<div class="glow" id="g-zuhr" aria-hidden="true"></div>
<div class="glow on" id="g-asr" aria-hidden="true"></div>
<div class="glow" id="g-maghrib" aria-hidden="true"></div>
<div class="glow" id="g-isha" aria-hidden="true"></div>

<div class="topbar" id="topbar" aria-hidden="true"><b id="topTitle">Today</b><span id="topLine"></span></div>

<div class="scroller" id="scroller">
<main class="app">
  <!-- TODAY -->
  <section class="view" id="view-today" aria-label="Today">
    <header class="header">
      <div>
        <h1>Today</h1>
        <p class="sub" id="todaySub">&nbsp;</p>
      </div>
      <span class="offline-pill">Offline</span>
    </header>

    <!-- Ramadan (shows automatically during Ramadan) -->
    <div class="ramadan glass" id="ramadan">
      <div class="hero-top">
        <div class="hero-icon" id="ramIcon"></div>
        <div style="flex-grow:1;min-width:0">
          <div class="hero-label">Ramadan Mubarak</div>
          <div class="hero-name" id="ramDay">&nbsp;</div>
        </div>
      </div>
      <div class="ram-strip" id="ramStrip"></div>
      <div class="tiles">
        <div class="tile iftar">
          <span class="tile-label" id="iftarLabel">Iftar in</span>
          <span class="tile-value roll" id="iftarValue"></span>
          <span class="tile-sub" id="iftarSub">&nbsp;</span>
        </div>
        <div class="tile suhoor">
          <span class="tile-label">Suhoor ends</span>
          <span class="tile-value" id="suhoorValue">&nbsp;</span>
          <span class="tile-sub" id="suhoorSub">&nbsp;</span>
        </div>
      </div>
    </div>

    <div class="hero glass" id="hero">
      <div class="hero-top">
        <div class="hero-icon" id="heroIcon"></div>
        <div style="flex-grow:1;min-width:0">
          <div class="hero-label" id="heroLabel">Next prayer</div>
          <div class="hero-name" id="heroName">&nbsp;</div>
        </div>
        <span class="chip" id="heroChip"></span>
      </div>
      <div class="tiles">
        <button class="tile begin press" id="beginTile" aria-label="Switch between countdown and clock time">
          <span class="tile-label"><span id="beginLabel">Begins in</span><span id="swap1"></span></span>
          <span class="tile-value roll" id="beginValue"></span>
          <span class="tile-sub" id="beginSub">&nbsp;</span>
          <span class="bar"><i id="beginBar"></i></span>
        </button>
        <button class="tile jamah press" id="jamahTile" aria-label="Switch between countdown and clock time">
          <span class="tile-label"><span id="jamahLabel">Jama'ah in</span><span id="swap2"></span></span>
          <span class="tile-value roll" id="jamahValue"></span>
          <span class="tile-sub" id="jamahSub">&nbsp;</span>
          <span class="bar"><i id="jamahBar"></i></span>
        </button>
      </div>
      <div class="soon">
        <div class="soon-box">
          <span class="tile-label">Jama'ah in</span>
          <span class="soon-value roll" id="soonValue"></span>
          <span class="tile-sub" id="soonSub">&nbsp;</span>
          <span class="bar"><i id="soonBar"></i></span>
        </div>
        <div class="soon-strip"><span id="soonStripIcon" style="display:flex;color:var(--clay)"></span><span id="soonStrip">&nbsp;</span><span class="r" id="soonStripR"></span></div>
      </div>
    </div>

    <div class="section-head"><h2>Prayer times</h2><span>Jama'ah</span></div>
    <div class="list glass" id="todayList"></div>
  </section>

  <!-- WEEK -->
  <section class="view" id="view-week" aria-label="Week">
    <header class="header">
      <div>
        <h1>This Week</h1>
        <p class="sub" id="weekSub">&nbsp;</p>
      </div>
      <button class="icon-btn glass press" id="shareWeek" aria-label="Share this week's times"></button>
    </header>
    <div class="list glass" id="weekTable"></div>
    <div id="weekChanges" style="display:flex;flex-direction:column;gap:16px"></div>
  </section>

  <!-- MONTH -->
  <section class="view" id="view-month" aria-label="Month">
    <header class="header">
      <div style="min-width:0">
        <h1 id="monthTitle">&nbsp;</h1>
        <p class="sub" id="monthSub">&nbsp;</p>
      </div>
      <div class="month-nav glass">
        <button class="press" id="prevMonth" aria-label="Previous month"></button>
        <button class="press" id="nextMonth" aria-label="Next month"></button>
      </div>
    </header>
    <div class="calendar glass">
      <div class="cal-grid" id="calGrid"></div>
      <div class="legend">
        <span><i class="dot"></i>Jama'ah times change</span>
        <span><b style="color:var(--text)">F</b>Bold = Friday</span>
      </div>
      <p id="appVersion" style="text-align:center;font-size:11px;color:var(--ter);padding:6px 0 2px">&nbsp;</p>
    </div>
  </section>
</main>
</div>

<div class="fade" aria-hidden="true"></div>

<nav class="tabbar glass" role="tablist" aria-label="Views" id="tabbar">
  <span class="tab-pill" aria-hidden="true"></span>
  <button class="tab press" role="tab" data-view="today" aria-selected="true"></button>
  <button class="tab press" role="tab" data-view="week" aria-selected="false"></button>
  <button class="tab press" role="tab" data-view="month" aria-selected="false"></button>
</nav>

<!-- Day sheet -->
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
  <div class="grabber"></div>
  <div class="sheet-head">
    <div>
      <h2 id="sheetTitle">&nbsp;</h2>
      <p id="sheetSub">&nbsp;</p>
    </div>
    <button class="close press" id="sheetClose" aria-label="Close">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="sheet-cols"><span>Begins</span><span>Jama'ah</span></div>
  <div id="sheetRows"></div>
</div>

<!-- Install hint -->
<div class="install glass" id="install">
  <p id="installText"><b>Install Salah Times</b><br>Add it to your Home Screen for quick access.</p>
  <button class="go press" id="installGo">Install</button>
  <button class="x" id="installX" aria-label="Dismiss">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
</div>

<div class="toast glass" id="toast" role="status" aria-live="polite"></div>

</div><!-- /#shell -->

  const t = date.getFullYear() === DATA_YEAR && prayerData[m] && prayerData[m][d];
  if (t) {
    const sr = sunriseData[m] && sunriseData[m][d];
    const isFriday = date.getDay() === 5;
    out = {
      date, isFriday,
      sunrise: sr ? atMinutes(date, toMinutes(sr, 'sunrise')) : null,
      prayers: PRAYERS.map((p) => ({
        key: p,
        name: p === 'zuhr' && isFriday ? "Jumu'ah" : NAMES[p],
        begin: atMinutes(date, toMinutes(t[p].begin, p)),
        jamah: atMinutes(date, toMinutes(t[p].jamah, p))
      }))
    };
  }
  dayCache.set(key, out);
  return out;
}

/* Hijri (Umm al-Qura) via the browser — no extra data needed */
function makeFmt(opts) {
  for (const cal of ['islamic-umalqura', 'islamic']) {
    try {
      const f = new Intl.DateTimeFormat(`en-GB-u-ca-${cal}`, opts);
      if (/islamic/.test(f.resolvedOptions().calendar)) return f;
    } catch (e) { /* unsupported */ }
  }
  return null;
}
const hijriFull = makeFmt({ day: 'numeric', month: 'long', year: 'numeric' });
const hijriParts = makeFmt({ day: 'numeric', month: 'short', year: 'numeric' });
const hijriMonthYear = makeFmt({ month: 'long', year: 'numeric' });
const hijriNum = makeFmt({ day: 'numeric', month: 'numeric', year: 'numeric' });
const partsOf = (fmt, d) => { const p = {}; fmt.formatToParts(d).forEach((x) => { p[x.type] = x.value; }); return p; };
function hijri(d) { return hijriFull ? hijriFull.format(d).replace(/\s*AH$/, '') : ''; }
function hijriBits(d) { return hijriParts ? partsOf(hijriParts, d) : null; }
function hijriMY(d) {
  if (!hijriMonthYear) return { month: '', year: '' };
  const p = partsOf(hijriMonthYear, d);
  return { month: p.month || '', year: (p.year || '').replace(/\s*AH$/, '') };
}
function ramadanInfo(date) {
  if (!hijriNum) return null;
  const p = partsOf(hijriNum, date);
  if (Number(p.month) !== 9) return null;
  const day = Number(p.day);
  let total = day;
  for (let i = 1; i <= 31; i++) {
    const q = partsOf(hijriNum, addDays(date, i));
    if (Number(q.month) !== 9) break;
    total = Math.max(total, Number(q.day));
  }
  return { day, total };
}

// Did any jama'ah time (except Maghrib, which moves daily) change from the day before?
function jamahChanges(date) {
  const today = getDay(date), prev = getDay(addDays(date, -1));
  if (!today || !prev) return [];
  const out = [];
  today.prayers.forEach((p, i) => {
    if (p.key === 'maghrib') return;
    const a = fmtShort(prev.prayers[i].jamah), b = fmtShort(p.jamah);
    if (a !== b) out.push({ key: p.key, name: NAMES[p.key], from: a, to: b });
  });
  return out;
}

/* ===================== Rolling digits ===================== */
function setRoll(el, text) {
  if (el._text === text) return;
  const prev = el._text || '';
  const isD = (c) => c >= '0' && c <= '9';
  const sameShape = prev.length === text.length && [...prev].every((c, i) => isD(c) === isD(text[i]) && (isD(c) || c === text[i]));
  if (!sameShape) {
    el.classList.add('noanim');
    el.innerHTML = [...text].map((c) => isD(c)
      ? `<span class="rd" aria-hidden="true"><span class="rs">${'0123456789'.split('').map((d) => `<span>${d}</span>`).join('')}</span></span>`
      : `<span aria-hidden="true">${c === ' ' ? '&nbsp;' : c}</span>`).join('');
  }
  const cols = el.querySelectorAll('.rs');
  let k = 0;
  [...text].forEach((c) => { if (isD(c)) cols[k++].style.transform = `translateY(${-Number(c) * 1.15}em)`; });
  el.setAttribute('aria-label', text);
  el._text = text;
  if (!sameShape) { void el.offsetHeight; el.classList.remove('noanim'); }
}

/* ===================== Today ===================== */
let clockMode = store.get('clockMode') === '1';
let lastListKey = '';
let topLine = '';

function currentPrayerKey(day, now) {
  if (!day) return null;
  const [f, z, a, m, i] = day.prayers;
  if (now >= f.begin && (!day.sunrise || now < day.sunrise)) return 'fajr';   // Fajr ends at sunrise
  if (now >= i.begin) return 'isha';
  if (now >= m.begin) return 'maghrib';
  if (now >= a.begin) return 'asr';
  if (now >= z.begin) return 'zuhr';
  return null;
}

function setGlow(key) {
  document.querySelectorAll('.glow').forEach((g) => g.classList.toggle('on', g.id === `g-${key}`));
}

function renderRamadan(now, today, tomorrow) {
  const info = ramadanInfo(now);
  const box = $('ramadan');
  box.classList.toggle('show', !!info && !!today);
  if (!info || !today) return info;
  $('ramDay').textContent = `Day ${info.day} of ${info.total}`;
  if ($('ramStrip').childElementCount !== info.total) {
    $('ramStrip').innerHTML = Array.from({ length: info.total }, () => '<i></i>').join('');
  }
  [...$('ramStrip').children].forEach((el, i) => el.classList.toggle('on', i < info.day));

  const maghrib = today.prayers[3].begin;
  if (now < maghrib) {
    $('iftarLabel').textContent = 'Iftar in';
    setRoll($('iftarValue'), fmtCountdown(maghrib - now));
    $('iftarSub').innerHTML = `Maghrib <b>${fmtTime(maghrib)}</b>`;
  } else {
    const nextRamadan = ramadanInfo(addDays(now, 1));
    $('iftarLabel').textContent = 'Next iftar';
    if (tomorrow && nextRamadan) {
      setRoll($('iftarValue'), fmtTime(tomorrow.prayers[3].begin));
      $('iftarSub').textContent = 'Tomorrow';
    } else {
      setRoll($('iftarValue'), 'Eid');
      $('iftarSub').textContent = 'Eid Mubarak';
    }
  }
  const fajrToday = today.prayers[0].begin;
  const suhoor = now < fajrToday ? fajrToday : (tomorrow ? tomorrow.prayers[0].begin : null);
  $('suhoorValue').textContent = suhoor ? fmtTime(suhoor) : '—';
  $('suhoorSub').textContent = suhoor ? (sameDay(suhoor, now) ? `Today · ${fmtIn(suhoor - now)}` : 'Tomorrow') : '';
  return info;
}

function renderToday() {
  const now = new Date();
  const today = getDay(now);
  const tomorrow = getDay(addDays(now, 1));
  $('todaySub').textContent = `${DAYS_SHORT[now.getDay()]} ${now.getDate()} ${MONTHS_SHORT[now.getMonth()]}${hijri(now) ? ' · ' + hijri(now) : ''} · Shahjalal`;

  if (!today) {
    $('hero').innerHTML = `<div class="empty">No timetable loaded for ${now.getFullYear()}.<br>Add this year's times to update the app.</div>`;
    $('todayList').innerHTML = '';
    return;
  }
  const ram = renderRamadan(now, today, tomorrow);

  // Flatten yesterday / today / tomorrow so progress and "tomorrow's Fajr" just work
  const flat = [];
  [addDays(now, -1), now, addDays(now, 1)].forEach((d, di) => {
    const day = getDay(d);
    if (day) day.prayers.forEach((p) => flat.push(Object.assign({ dayIndex: di }, p)));
  });
  const idx = flat.findIndex((p) => p.jamah > now);
  const next = flat[idx];
  const prev = idx > 0 ? flat[idx - 1] : null;
  const current = currentPrayerKey(today, now);

  if (next) {
    setGlow(next.key);
    const begun = now >= next.begin;
    const isTomorrow = next.dayIndex === 2;
    const toJamah = next.jamah - now;
    const soon = !isTomorrow && toJamah <= 15 * 60 * 1000;
    const pct = (from, to) => (!from ? 0 : Math.min(100, Math.max(0, ((now - from) / (to - from)) * 100)));

    $('hero').classList.toggle('is-soon', soon);
    $('heroIcon').innerHTML = svg(next.key, 24);

    if (soon) {
      $('heroLabel').textContent = begun ? `${next.name} · time has begun` : next.name;
      $('heroName').textContent = "Jama'ah soon";
      $('heroChip').textContent = '';
      setRoll($('soonValue'), fmtMS(toJamah));
      $('soonSub').innerHTML = `at <b>${fmtTime(next.jamah)}</b>`;
      $('soonBar').style.width = Math.min(100, ((15 * 60 * 1000 - toJamah) / (15 * 60 * 1000)) * 100) + '%';
      $('soonStripIcon').innerHTML = svg('clock', 16);
      if (begun) {
        $('soonStrip').innerHTML = `${next.name} began at <b>${fmtTime(next.begin)}</b>`;
        $('soonStripR').textContent = fmtAgo(now - next.begin);
      } else {
        $('soonStrip').innerHTML = `${next.name} begins at <b>${fmtTime(next.begin)}</b>`;
        $('soonStripR').textContent = fmtMS(next.begin - now);
      }
    } else {
      $('heroLabel').textContent = isTomorrow ? 'Next prayer · Tomorrow' : 'Next prayer';
      $('heroName').textContent = next.name;
      $('heroChip').textContent = isTomorrow ? '' : (current && current !== next.key ? `${NAMES[current]} now` : (begun ? 'Time has begun' : ''));

      if (!begun) {
        $('beginLabel').textContent = clockMode ? 'Begins at' : 'Begins in';
        setRoll($('beginValue'), clockMode ? fmtTime(next.begin) : fmtCountdown(next.begin - now));
        $('beginSub').innerHTML = clockMode ? fmtIn(next.begin - now) : `at <b>${fmtTime(next.begin)}</b>`;
        $('beginBar').style.width = pct(prev && prev.begin, next.begin) + '%';
      } else {
        $('beginLabel').textContent = 'Began';
        setRoll($('beginValue'), fmtTime(next.begin));
        $('beginSub').textContent = fmtAgo(now - next.begin);
        $('beginBar').style.width = '100%';
      }
      $('jamahLabel').textContent = clockMode ? "Jama'ah at" : "Jama'ah in";
      setRoll($('jamahValue'), clockMode ? fmtTime(next.jamah) : fmtCountdown(toJamah));
      $('jamahSub').innerHTML = clockMode ? fmtIn(toJamah) : `at <b>${fmtTime(next.jamah)}</b>`;
      $('jamahBar').style.width = pct(prev && prev.jamah, next.jamah) + '%';
    }
    topLine = begun
      ? `<i class="g">Jama'ah ${fmtCountdown(toJamah)}</i>`
      : `<i class="c">${next.name} ${fmtCountdown(next.begin - now)}</i><i style="color:var(--ter)">·</i><i class="g">Jama'ah ${fmtCountdown(toJamah)}</i>`;
    if (currentView === 'today') $('topLine').innerHTML = topLine;
  }

  // Rebuild the list only when something visible in it changes
  const nextKey = next && next.dayIndex === 1 ? next.key : '';
  const listKey = `${today.date.toDateString()}|${current}|${nextKey}|${now.getHours()}:${now.getMinutes()}|${!!ram}`;
  if (listKey === lastListKey) return;
  lastListKey = listKey;

  $('todayList').innerHTML = today.prayers.map((p) => {
    const isNow = p.key === current;
    const isNext = p.key === nextKey;
    const isPast = !isNow && !isNext && p.jamah <= now;
    const cls = isNext ? 'is-next' : isNow ? 'is-now' : isPast ? 'is-past' : '';
    const pill = isNext ? '<span class="pill next">Next</span>' : isNow ? '<span class="pill now">Now</span>' : '';
    let sub = `Begins ${fmtTime(p.begin)}`;
    if (p.key === 'fajr' && ram) sub += ' · Suhoor ends';
    else if (p.key === 'fajr' && today.sunrise) sub += ' · Sunrise ' + fmtTime(today.sunrise);
    if (p.key === 'maghrib' && ram) sub += ' · Iftar';
    return `<div class="row ${cls}">
      <div class="row-icon">${svg(p.key, 19)}</div>
      <div class="row-main"><div class="row-title">${p.name}${pill}</div><div class="row-sub">${sub}</div></div>
      <div class="row-time">${fmtTime(p.jamah)}</div>
    </div>`;
  }).join('');
}

/* ===================== Week ===================== */
function weekDays() {
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Array.from({ length: 7 }, (_, i) => addDays(start, i));
}
function weekRangeText(days, long) {
  const s = days[0], e = days[6];
  return s.getMonth() === e.getMonth()
    ? `${s.getDate()} – ${e.getDate()} ${long ? MONTHS[s.getMonth()] : MONTHS_SHORT[s.getMonth()]}`
    : `${s.getDate()} ${MONTHS_SHORT[s.getMonth()]} – ${e.getDate()} ${MONTHS_SHORT[e.getMonth()]}`;
}
function renderWeek() {
  const days = weekDays();
  $('weekSub').textContent = `${weekRangeText(days, true)} · Jama'ah times`;

  let html = `<div class="week-head"><span style="flex-grow:1">Day</span>${PRAYERS.map((p) => `<span class="wcol">${SHORT[p]}</span>`).join('')}</div>`;
  const changeCards = [];
  days.forEach((date, i) => {
    const day = getDay(date);
    const changes = jamahChanges(date);
    const changed = new Set(i > 0 ? changes.map((c) => c.key) : []);
    if (i > 0 && changes.length) changeCards.push({ date, changes });
    const hb = hijriBits(date);
    const hLine = hb ? `${hb.day} ${hb.month}` : '';
    const cells = day ? day.prayers.map((p) =>
      `<div class="wcol wcell${changed.has(p.key) ? ' changed' : ''}"><span>${fmtShort(p.jamah)}</span>${p.key === 'zuhr' && day.isFriday ? "<small>JUMU'AH</small>" : ''}</div>`
    ).join('') : `<div class="wcell" style="flex-grow:1;color:var(--ter)">No data</div>`;
    html += `<button class="week-row press${i === 0 ? ' today' : ''}" data-date="${date.toISOString()}" aria-label="${DAYS[date.getDay()]} ${date.getDate()} ${MONTHS[date.getMonth()]}">
      <div class="week-day"><b>${DAYS_SHORT[date.getDay()]} ${date.getDate()}</b><span>${i === 0 ? 'Today' + (hLine ? ' · ' + hLine : '') : hLine}</span></div>${cells}
    </button>`;
  });
  $('weekTable').innerHTML = html;
  $('weekChanges').innerHTML = changeCards.map(({ date, changes }) => `
    <div class="changes glass">
      <div class="changes-title">Jama'ah changes from ${DAYS_SHORT[date.getDay()]} ${date.getDate()} ${MONTHS_SHORT[date.getMonth()]}</div>
      ${changes.map((c) => `<div class="change-row"><span style="color:var(--sec);display:flex">${svg(c.key, 19)}</span><span class="name">${c.name}</span><s>${c.from}</s><span style="color:var(--ter);display:flex">${svg('chevr', 14, 2.2)}</span><span class="new">${c.to}</span></div>`).join('')}
    </div>`).join('');
}

}

  const day = getDay(date);
  if (!day) return;
  const ram = ramadanInfo(date);
  $('sheetTitle').textContent = `${DAYS[date.getDay()]} ${date.getDate()} ${MONTHS[date.getMonth()]}`;
  $('sheetSub').textContent = [hijri(date), day.isFriday ? "Jumu'ah" : ''].filter(Boolean).join(' · ') || String(date.getFullYear());
  const rows = [];
  day.prayers.forEach((p) => {
    const label = ram && p.key === 'fajr' ? 'Fajr · Suhoor ends' : ram && p.key === 'maghrib' ? 'Maghrib · Iftar' : p.name;
    rows.push(`<div class="srow${p.key === 'zuhr' && day.isFriday ? ' jum' : ''}"><span class="ic">${svg(p.key, 18)}</span><span class="nm">${label}</span><span class="b">${fmtTime(p.begin)}</span><span class="j">${fmtTime(p.jamah)}</span></div>`);
    if (p.key === 'fajr' && day.sunrise) {
      rows.push(`<div class="srow muted"><span class="ic">${svg('sunrise', 18)}</span><span class="nm">Sunrise</span><span class="b">${fmtTime(day.sunrise)}</span><span class="j">—</span></div>`);
    }
  });
  $('sheetRows').innerHTML = rows.join('');
  lastFocus = document.activeElement;
  $('backdrop').classList.add('open');
  $('sheet').classList.add('open');
  $('sheet').setAttribute('aria-hidden', 'false');
  setTimeout(() => $('sheetClose').focus({ preventScroll: true }), 50);
}
function closeSheet() {
  $('backdrop').classList.remove('open');
  $('sheet').classList.remove('open');
  $('sheet').setAttribute('aria-hidden', 'true');
  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
}
$('backdrop').addEventListener('click', closeSheet);
$('sheetClose').addEventListener('click', closeSheet);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('sheet').classList.contains('open')) closeSheet(); });
(() => { // swipe the sheet down to close
  let y0 = null;
  const s = $('sheet');
  s.addEventListener('touchstart', (e) => { y0 = e.touches[0].clientY; }, { passive: true });
  s.addEventListener('touchmove', (e) => {
    if (y0 === null) return;
    const dy = e.touches[0].clientY - y0;
    if (dy > 0) { s.style.transition = 'none'; s.style.transform = `translateY(${dy}px)`; }
  }, { passive: true });
  s.addEventListener('touchend', (e) => {
    if (y0 === null) return;
    const dy = e.changedTouches[0].clientY - y0;
    s.style.transition = ''; s.style.transform = '';
    y0 = null;
    if (dy > 90) closeSheet();
  });
})();
$('weekTable').addEventListener('click', (e) => { const b = e.target.closest('[data-date]'); if (b) openSheet(new Date(b.dataset.date)); });
$('calGrid').addEventListener('click', (e) => { const b = e.target.closest('[data-date]'); if (b && !b.disabled) openSheet(new Date(b.dataset.date)); });
$('prevMonth').innerHTML = svg('chevl', 20, 2);
$('nextMonth').innerHTML = svg('chevr', 20, 2);
$('prevMonth').addEventListener('click', () => { if (viewMonth > 0) { viewMonth--; renderMonth(); } });
$('nextMonth').addEventListener('click', () => { if (viewMonth < 11) { viewMonth++; renderMonth(); } });

/* ===================== Tabs + compact title ===================== */
const VIEWS = ['today', 'week', 'month'];
const TITLES = { today: 'Today', week: 'This Week', month: '' };
let currentView = 'today';
document.querySelectorAll('.tab').forEach((t) => {
  const v = t.dataset.view;
  t.innerHTML = `${svg(v, 22)}<span>${v[0].toUpperCase() + v.slice(1)}</span>`;
  t.addEventListener('click', () => showView(v, true));
});
function showView(v, push) {
  if (!VIEWS.includes(v)) v = 'today';
  currentView = v;
  document.querySelectorAll('.view').forEach((s) => s.classList.toggle('active', s.id === `view-${v}`));
  document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.view === v)));
  $('tabbar').style.setProperty('--i', VIEWS.indexOf(v));
  $('topTitle').textContent = TITLES[v] || `${MONTHS[viewMonth]} ${viewYear}`;
  $('topLine').innerHTML = v === 'today' ? topLine : '';
  if (v === 'week') renderWeek();
  if (v === 'month') renderMonth();
  if (push) history.replaceState(null, '', v === 'today' ? location.pathname : `#${v}`);
  $('scroller').scrollTop = 0;
  $('topbar').classList.remove('show');
}
window.addEventListener('hashchange', () => showView(location.hash.slice(1)));
$('scroller').addEventListener('scroll', () => {
  $('topbar').classList.toggle('show', $('scroller').scrollTop > 56);
}, { passive: true });

/* ===================== Clock ===================== */
let lastDate = new Date().toDateString();
function tick() {
  const nowStr = new Date().toDateString();
  if (nowStr !== lastDate) { // midnight rollover
    lastDate = nowStr; dayCache.clear(); lastListKey = '';
    if (currentView === 'week') renderWeek();
    if (currentView === 'month') renderMonth();
  }
  renderToday();
}
function startClock() {
  tick();
  setTimeout(() => { tick(); setInterval(tick, 1000); }, 1000 - (Date.now() % 1000));
}

/* ===================== Online / offline ===================== */
function updateOnline() { document.body.classList.toggle('offline', !navigator.onLine); }
window.addEventListener('online', updateOnline);
window.addEventListener('offline', updateOnline);

/* ===================== Install hint + iOS launch screen ===================== */
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

// iOS shows a white screen while an installed web app starts unless a launch image
// is provided. Draw one for this exact screen size when the page is opened in Safari,
// so it's in place when the user taps "Add to Home Screen".
async function addLaunchImage() {
  const w = screen.width, h = screen.height, dpr = window.devicePixelRatio || 1;
  const c = document.createElement('canvas');
  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  const x = c.getContext('2d'); x.scale(dpr, dpr);
  x.fillStyle = '#08151C'; x.fillRect(0, 0, w, h);
  const g = x.createRadialGradient(w * 0.25, -h * 0.05, 0, w * 0.25, -h * 0.05, h * 0.75);
  g.addColorStop(0, 'rgba(31,77,92,0.95)'); g.addColorStop(1, 'rgba(31,77,92,0)');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  const icon = await loadImage('icon-512.png');
  const s = 108, cx = w / 2, cy = h / 2 - 30;
  if (icon) { x.save(); roundRect(x, cx - s / 2, cy - s / 2, s, s, 24); x.clip(); x.drawImage(icon, cx - s / 2, cy - s / 2, s, s); x.restore(); }
  const F = '-apple-system, BlinkMacSystemFont, system-ui, sans-serif';
  x.textAlign = 'center';
  x.fillStyle = '#F7F4EC'; x.font = `700 26px ${F}`; x.fillText('Salah Times', cx, cy + s / 2 + 44);
  x.fillStyle = '#B7C6CD'; x.font = `400 14px ${F}`; x.fillText('Shahjalal Masjid · Manor Park', cx, cy + s / 2 + 68);
  const link = document.createElement('link');
  link.rel = 'apple-touch-startup-image';
  link.href = c.toDataURL('image/png');
  document.head.appendChild(link);
}
if (isIOS && !isStandalone) window.addEventListener('load', () => { addLaunchImage().catch(() => {}); });

(() => {
  if (isStandalone || store.get('installDismissed') === '1') return;
  const box = $('install');
  const hide = () => { box.classList.remove('show'); store.set('installDismissed', '1'); };
  $('installX').addEventListener('click', hide);
  if (isIOS) {
    $('installText').innerHTML = '<b>Install Salah Times</b><br>Tap Share, then “Add to Home Screen”.';
    $('installGo').style.display = 'none';
    setTimeout(() => box.classList.add('show'), 2500);
    return;
  }
  let deferred = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); deferred = e;
    setTimeout(() => box.classList.add('show'), 2500);
  });
  $('installGo').addEventListener('click', async () => {
    if (!deferred) return hide();
    deferred.prompt();
    try { await deferred.userChoice; } catch (e) {}
    deferred = null; hide();
  });
  window.addEventListener('appinstalled', hide);
})();

/* ===================== Auto-update ===================== */
// 1) sw.js is re-checked every time the app is opened or brought back to the front.
//    If it changed, the new worker takes over and the page reloads itself once.
// 2) index.html is fetched network-first by the service worker, and when the app is
//    resumed from the background we also compare the server's ETag / Last-Modified,
//    so HTML-only edits show up without touching sw.js.
if ('serviceWorker' in navigator) {
  let hasController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hasController) { hasController = true; return; } // first install: no reload needed
    if (reloading) return;
    reloading = true;
    location.reload();
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then((reg) => {
      const activate = (w) => { if (w && navigator.serviceWorker.controller) w.postMessage({ type: 'SKIP_WAITING' }); };
      if (reg.waiting) activate(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        if (w) w.addEventListener('statechange', () => { if (w.state === 'installed') activate(w); });
      });
      const check = () => { if (navigator.onLine) reg.update().catch(() => {}); };
      check();
      setInterval(check, 15 * 60 * 1000);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
    }).catch((err) => console.warn('Service worker registration failed:', err));
  });
}
(() => {
  let stamp = null, lastCheck = 0;
  const readStamp = () => fetch('./index.html', { method: 'HEAD', cache: 'no-store' })
    .then((r) => r.ok ? (r.headers.get('ETag') || r.headers.get('Last-Modified')) : null)
    .catch(() => null);
  window.addEventListener('load', () => { readStamp().then((s) => { stamp = s; }); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || !navigator.onLine || !stamp) return;
    if (Date.now() - lastCheck < 30000) return;
    lastCheck = Date.now();
    readStamp().then((s) => { if (s && s !== stamp) location.reload(); });
  });
})();

/* ===================== iOS short web view ===================== */
// iOS 26 bug: with the see-through status bar, an installed web app's web view stops one
// status-bar height above the bottom of the screen, and nothing can be drawn below that.
// The home-indicator strip is then outside the web view too, so drop the bottom safe-area
// padding and sit the tab bar at the bottom of the space we do have.
function fitBottom() {
  const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  const probe = document.createElement('div');
  probe.style.cssText = 'position:absolute;visibility:hidden;padding-top:env(safe-area-inset-top)';
  document.body.appendChild(probe);
  const safeTop = parseFloat(getComputedStyle(probe).paddingTop) || 0;
  probe.remove();
  const screenH = window.matchMedia('(orientation: portrait)').matches ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
  const short = standalone && safeTop > 0 && (screenH - window.innerHeight) > 20;
  document.documentElement.classList.toggle('short-vp', short);
}
fitBottom();
window.addEventListener('resize', fitBottom);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') fitBottom(); });

const APP_VERSION = '2026.09.24-10';
function showVersion() {
  const probe = document.createElement('div');
  probe.style.cssText = 'position:absolute;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)';
  document.body.appendChild(probe);
  const cs = getComputedStyle(probe);
  const st = Math.round(parseFloat(cs.paddingTop) || 0), sb = Math.round(parseFloat(cs.paddingBottom) || 0);
  probe.remove();
  $('appVersion').textContent = `Version ${APP_VERSION} · ${window.innerHeight}/${Math.max(screen.width, screen.height)} · top ${st} · bottom ${sb}${document.documentElement.classList.contains('short-vp') ? ' · short' : ''}`;
}
showVersion();
window.addEventListener('resize', showVersion);

/* ===================== No zoom ===================== */
// iOS ignores user-scalable=no for pinch, so block Safari's gesture events too.
['gesturestart', 'gesturechange', 'gestureend'].forEach((ev) => document.addEventListener(ev, (e) => e.preventDefault(), { passive: false }));
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
document.addEventListener('touchmove', (e) => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });

/* ===================== Start ===================== */
updateOnline();
showView(location.hash.slice(1) || 'today');
startClock();
</script>
